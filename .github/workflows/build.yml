name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Bibliothèques PDF hors-ligne
        run: |
          mkdir -p www/vendor
          curl -sSL -o www/vendor/html2canvas.min.js https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js
          curl -sSL -o www/vendor/jspdf.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js

      - name: Dépendances
        run: npm install

      - name: Projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Compilation APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommage
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/PrixHook-${{ env.VERSION }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrixHook-${{ env.VERSION }}
          path: out/PrixHook-${{ env.VERSION }}.apk
